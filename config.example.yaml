# ============ 必填 ============
# Telegram API 凭证 (https://my.telegram.org 获取)
api_id: 12345678
api_hash: 0123456789abcdef0123456789abcdef

# 机器人 Token (https://t.me/BotFather 获取)
bot_token: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA

# ============ 可选 ============
# 代理 (如需连接 Telegram 请配置)
proxy:
  scheme: http
  hostname: 127.0.0.1
  port: 7890

# 监听频道列表(可多个,程序同时监听下载所有频道)
chat:
- chat_id: -1001714422299
  last_read_message_id: 0
  max_file_size: 0
  download_filter: ''

# 全局大小限制(对所有下载生效,含机器人命令下载的文件;
# 频道"大小限制"填 0 时跟随此全局值; 填 0 表示不限)
max_size_enabled: true
max_size: 500

# 单文件下载超时(分钟): 超过自动停止并重试(最多3次), 3次仍失败自动删除任务与缓存; 0=不限
download_timeout: 0

# 下载的媒体类型
media_types:
- video
- audio
- video_note

# Web 界面
web_host: 0.0.0.0
web_port: 5000

# 保存路径
save_path: /app/downloads

# 并发下载数
max_download_task: 2

# 每频道并发下载数(每个频道同时下载任务数, 0=不限制, 受限于全局并发)
max_download_task_per_chat: 1

# 语言: ZH=中文 EN=English
language: ZH
