# ============ 必填 ============
# Telegram API 凭证 (https://my.telegram.org 获取)
api_id: 12345678
api_hash: 0123456789abcdef0123456789abcdef

# 机器人 Token (https://t.me/BotFather 获取)
bot_token: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA

# ============ 可选 ============
# 代理 (如需连接 Telegram 请配置)
proxy:
  scheme: http
  hostname: 127.0.0.1
  port: 7890

# 监听频道列表(可多个,程序同时监听下载所有频道)
chat:
- chat_id: https://t.me/频道用户名
  last_read_message_id: 0
  max_file_size: 0
  download_filter: ''
- chat_id: -1001234567890
  last_read_message_id: 0
  max_file_size: 500
  download_filter: 'video'

# 下载的媒体类型
media_types:
- video
- audio
- video_note

# Web 界面
web_host: 0.0.0.0
web_port: 5000

# 保存路径
save_path: /app/downloads

# 并发下载数
max_download_task: 2

# 语言: ZH=中文 EN=English
language: ZH
